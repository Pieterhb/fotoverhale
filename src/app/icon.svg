<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C52222" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#crimsonGrad)" stroke="#E08838" stroke-width="16" />
  
  <!-- Inner subtle border -->
  <rect x="44" y="44" width="424" height="424" rx="76" ry="76" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- "FV" Text -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" 
        font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Oswald', 'Bebas Neue', 'Segoe UI Black', 'Arial Black', sans-serif" 
        font-size="250" font-weight="900" letter-spacing="12" fill="#F5EFEB">FV</text>
</svg>